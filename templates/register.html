<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register</title>
    <style>
      :root { --bg:#0f1115; --card:#1a1f2b; --text:#e7ecf2; --muted:#a7b0bf; --accent:#7bd8ff; }
      body { margin:0; font-family:"Fira Sans",system-ui,-apple-system,sans-serif; background:radial-gradient(1200px 700px at 20% -10%, #1f2942 0%, #0f1115 60%); color:var(--text); }
      .wrap { max-width:520px; margin:0 auto; padding:48px 20px; }
      .card { background:var(--card); border-radius:16px; padding:24px; box-shadow:0 12px 30px rgba(0,0,0,.35); }
      label { display:block; margin:12px 0 6px; color:var(--muted); font-size:14px; }
      input { width:100%; padding:10px 12px; border-radius:10px; border:1px solid #2c3547; background:#0f141f; color:var(--text); }
      button { margin-top:16px; background:var(--accent); color:#071018; border:none; padding:12px 18px; border-radius:12px; font-weight:700; cursor:pointer; width:100%; }
      a { color:var(--accent); }
      .error { color:#ff9a9a; margin-top:10px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h2>Create Account</h2>
        <form method="post" action="/register">
          <label for="full_name">Name</label>
          <input id="full_name" name="full_name" type="text" required />
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required />
          <label for="dob">Date of birth</label>
          <input id="dob" name="dob" type="date" />
          <label for="height_in">Height (inches)</label>
          <input id="height_in" name="height_in" type="number" step="0.1" min="36" max="96" />
          <label for="weight_lbs">Weight (lbs)</label>
          <input id="weight_lbs" name="weight_lbs" type="number" step="0.1" min="50" max="600" />
          <label for="max_bench_lbs">Max bench (lbs)</label>
          <input id="max_bench_lbs" name="max_bench_lbs" type="number" step="0.1" min="1" />
          <label for="max_deadlift_lbs">Max deadlift (lbs)</label>
          <input id="max_deadlift_lbs" name="max_deadlift_lbs" type="number" step="0.1" min="1" />
          <label for="max_back_squat_lbs">Max back squat (lbs)</label>
          <input id="max_back_squat_lbs" name="max_back_squat_lbs" type="number" step="0.1" min="1" />
          <label for="standing_vertical_jump_in">Standing vertical jump (inches)</label>
          <input id="standing_vertical_jump_in" name="standing_vertical_jump_in" type="number" step="0.1" min="1" />
          <label for="rotational_scoop_toss_ft">Rotational scoop toss (ft)</label>
          <input id="rotational_scoop_toss_ft" name="rotational_scoop_toss_ft" type="number" step="0.1" min="1" />
          <label for="cable_chop_lbs">Cable chop load (lbs)</label>
          <input id="cable_chop_lbs" name="cable_chop_lbs" type="number" step="0.1" min="1" />
          <label for="med_ball_chest_pass_ft">Med ball chest pass (ft)</label>
          <input id="med_ball_chest_pass_ft" name="med_ball_chest_pass_ft" type="number" step="0.1" min="1" />
          <label for="max_exit_velocity_mph">Ball exit velo (mph)</label>
          <input id="max_exit_velocity_mph" name="max_exit_velocity_mph" type="number" step="0.1" min="1" />
          <label for="position">Position</label>
          <input id="position" name="position" type="text" placeholder="outfielder" />
          <label for="goal">Goal</label>
          <select id="goal" name="goal">
            <option value="power">Power</option>
            <option value="speed">Speed</option>
            <option value="hypertrophy">Hypertrophy</option>
            <option value="general">General</option>
          </select>
          <label for="phase">Phase</label>
          <select id="phase" name="phase">
            <option value="offseason">Off-season</option>
            <option value="preseason">Pre-season</option>
            <option value="inseason">In-season</option>
            <option value="postseason">Post-season</option>
            <option value="return_to_play">Return to play</option>
          </select>
          <label for="injuries">Injuries (comma separated)</label>
          <input id="injuries" name="injuries" type="text" placeholder="shoulder, knee" />
          <label for="admin_code">Admin code (optional)</label>
          <input id="admin_code" name="admin_code" type="text" placeholder="Only if you are staff" />
          <button type="submit">Create account</button>
        </form>
        {% if error %}
          <div class="error">{{ error }}</div>
        {% endif %}
        <p class="muted">Already have an account? <a href="/login">Log in</a></p>
      </div>
    </div>
  </body>
</html>

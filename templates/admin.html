<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard</title>
    <style>
      body { margin:0; font-family:"Fira Sans",system-ui,-apple-system,sans-serif; background:#0f1115; color:#e7ecf2; }
      .wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 48px; }
      .card { background:#1a1f2b; border-radius:14px; padding:16px; margin-bottom:12px; }
      table { width:100%; border-collapse: collapse; }
      th, td { text-align:left; padding:8px; border-bottom:1px solid #2c3547; font-size:14px; }
      a { color:#7bd8ff; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Admin Dashboard</h1>
      <p><a href="/">Back to generator</a> | <a href="/admin/workouts">All workouts</a> | <a href="/admin/exercises">Exercise editor</a> | <a href="/admin/benchmarks">Benchmark QA</a></p>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Completed Logs</th>
              <th>View</th>
            </tr>
          </thead>
          <tbody>
            {% for user in users %}
            <tr>
              <td>{{ user.full_name or "-" }}</td>
              <td>{{ user.email }}</td>
              <td>{{ "Admin" if user.is_admin == 1 else "User" }}</td>
              <td>{{ user.log_count }}</td>
              <td><a href="/admin/user/{{ user.id }}">Open</a></td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>

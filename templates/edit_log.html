<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Log</title>
    <style>
      body { margin:0; font-family:"Fira Sans",system-ui,-apple-system,sans-serif; background:#0f1115; color:#e7ecf2; }
      .wrap { max-width: 520px; margin: 0 auto; padding: 24px 20px 48px; }
      .card { background:#1a1f2b; border-radius:14px; padding:20px; }
      label { display:block; margin:10px 0 6px; color:#a7b0bf; }
      input { width:100%; padding:10px; border-radius:8px; border:1px solid #2c3547; background:#0f141f; color:#e7ecf2; }
      button { margin-top:14px; padding:10px 14px; border:none; border-radius:8px; background:#7bd8ff; color:#071018; font-weight:700; cursor:pointer; }
      a { color:#7bd8ff; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Edit Log</h1>
      <p><a href="/history">Back to history</a></p>
      <div class="card">
        <p><strong>{{ log.exercise_name }}</strong> ({{ log.category }})</p>
        <form method="post" action="/history/edit/{{ log.id }}">
          <label for="date">Date</label>
          <input id="date" name="date" type="date" value="{{ log.date }}" />
          <label for="weight">Weight</label>
          <input id="weight" name="weight" type="number" step="0.1" value="{{ log.weight if log.weight is not none else '' }}" />
          {% set is_time = is_time_based_exercise(log.exercise_name) %}
          <label for="reps">{{ 'Seconds' if is_time else 'Reps' }}</label>
          <input id="reps" name="reps" type="number" step="1" value="{{ log.reps if log.reps is not none else '' }}" />
          <button type="submit">Save changes</button>
        </form>
      </div>
    </div>
  </body>
</html>

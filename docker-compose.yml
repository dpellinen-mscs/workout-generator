services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://wg_user:wg_pass@db:5432/workout_generator
      WG_SECRET_KEY: dev-secret
      WG_ADMIN_CODE: coach-admin-123
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: workout_generator
      POSTGRES_USER: wg_user
      POSTGRES_PASSWORD: wg_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wg_user -d workout_generator"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
